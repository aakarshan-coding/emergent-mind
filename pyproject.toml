[project]
name = "emergent-mind"
version = "0.0.1"
description = "Investigating cognitive emergence in multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
